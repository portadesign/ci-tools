name: Claude review

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: ''

jobs:
  review:
    if: >
      github.event_name == 'pull_request' &&
      !contains(fromJSON('[]'), github.repository) &&
      (github.event.requested_team.slug == 'claude-review' ||
       github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: profile
        if: inputs.profile != ''
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          case "$PROFILE" in *[!a-z0-9-]*) echo "Invalid profile: $PROFILE"; exit 1;; esac
          rules=$(curl -fsSL "https://raw.githubusercontent.com/portadesign/ci-tools/main/profiles/$PROFILE.md")
          {
            echo 'rules<<CI_TOOLS_PROFILE'
            echo "$rules"
            echo 'CI_TOOLS_PROFILE'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_015GCaPiazDcrtMRYWxSZUxD
          anthropic_organization_id: d0b2986d-e82b-4714-8516-6a64f6df3343
          anthropic_service_account_id: svac_01W69zaPVEJzLA8xD1pRL7pt
          anthropic_workspace_id: wrkspc_012LeEaC25B2aaqjaHKMtmJb
          github_token: ${{ github.token }}
          track_progress: ${{ github.event.action == 'labeled' }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR; the branch is checked out. Read AGENTS.md and
            CLAUDE.md first when they exist. Check:
            - Correctness: logic errors, unhandled edge cases, callers broken
              by the change.
            - Security: injection, missing authorization, secrets in code or
              logs, unsafe handling of files and URLs.
            - Performance: queries or I/O in loops, unbounded loads, no
              pagination or chunking.
            - Outside input: loose comparison, valid values treated as empty,
              wrong type, case/Unicode, empty and duplicate values.
            - Errors: swallowed exceptions, wrong exit or status codes,
              partial writes without rollback.
            - Compatibility: breaking change to a public API, schema or
              config without a migration path.
            - Tests: a new condition on outside input without a test.
            ${{ steps.profile.outputs.rules }}
            Breaking these, AGENTS.md or CLAUDE.md is ❌ (blocks merge); the
            rest is ⚠️.

            Output in English, terse, no praise, no restating the diff.
            Summary via `gh pr comment`. First line is the verdict:
            `✅ Merge` when there is no ❌, else `❌ Fix first`. A ✅ summary
            never contains the ❌ character or a count of zero. Then
            numbered lines `01. ❌ path:line: defect. Fix.` Every ❌, never
            cut; at most 5 ⚠️ plus the count of the rest. Each ❌ also inline
            via `mcp__github_inline_comment__create_inline_comment`
            (`confirmed: true`), max 3 sentences.
          claude_args: |
            --model claude-sonnet-5-5
            --permission-mode default
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git push:*),Bash(git commit:*)"

  mention:
    if: >
      github.event_name != 'pull_request' &&
      !contains(fromJSON('[]'), github.repository) &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_015GCaPiazDcrtMRYWxSZUxD
          anthropic_organization_id: d0b2986d-e82b-4714-8516-6a64f6df3343
          anthropic_service_account_id: svac_01W69zaPVEJzLA8xD1pRL7pt
          anthropic_workspace_id: wrkspc_012LeEaC25B2aaqjaHKMtmJb
          claude_args: |
            --model claude-sonnet-5-5
            --append-system-prompt "Reply in English unless the comment asks for another language. Be terse and technical: code and path:line references over prose, no preamble, no recap."
